# TLS edge of the Vaultwarden rig: https://localhost:8443 on the Mac (published on loopback only).
# The upstream (which Vaultwarden version), the feature flag and the optional PUT answer delay are
# included from dev-vault/nginx, written by scripts/host/vaultwarden.sh. See RUNBOOK.md.
events {}

http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Answer throttle for PUT only. $rig_put_rate is 0 (no limit) unless dev-vault/nginx/delay/ holds
  # a `set $rig_put_rate N;` line, so every other method keeps full speed.
  map $request_method $rig_slow {
    default 0;
    PUT     $rig_put_rate;
  }

  # Fidelity evidence: the exact cipher create/update bodies real Prizm sends (ciphertext only).
  log_format cipherbody escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"body":"$request_body"}';

  # Docker's embedded DNS. Resolving at request time (proxy_pass with a variable) survives a
  # version switch or a restarted Vaultwarden container with a new IP.
  resolver 127.0.0.11 valid=5s;

  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate     /certs/vw.crt;
    ssl_certificate_key /certs/vw.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Vaultwarden's own attachment limit is 525 MB.
    client_max_body_size 525M;

    # Sets $vw_upstream to the active Vaultwarden service.
    include /etc/nginx/rig/upstream.conf;

    # Default for the answer throttle above; a file in delay/ overrides it inside the cipher location.
    set $rig_put_rate 0;

    location = /api/config {
      proxy_pass $vw_upstream;
      proxy_set_header Host $http_host;
      # sub_filter cannot rewrite a compressed body.
      proxy_set_header Accept-Encoding "";
      sub_filter_types application/json;
      sub_filter_once on;
      # Flag on: one sub_filter line in flag/. Flag off: an empty directory, which a glob allows.
      include /etc/nginx/rig/flag/*.conf;
    }

    # Cipher create and update only. Never add body logging to /identity/ (the token request
    # carries the master password hash) or to attachment paths.
    # Quoted: unquoted, nginx reads the { of {36} as the start of the block.
    location ~ "^/api/ciphers(/[0-9a-f-]{36})?$" {
      # Slows only the answer to PUT /api/ciphers/{id}, so a test can lock the app while a save is
      # still in flight. The server stores the edit at once. GET refreshes (Prizm gives them a 10 s
      # timeout) and POST creates are never throttled. An empty delay directory means off, as for
      # the feature flag.
      include /etc/nginx/rig/delay/*.conf;
      limit_rate $rig_slow;
      # $request_body is only set when the whole body sits in one memory buffer.
      client_body_buffer_size 1m;
      client_body_in_single_buffer on;
      access_log /var/log/nginx/rig/cipher-bodies.log cipherbody;
      proxy_pass $vw_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass $vw_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebSocket notifications at /notifications/hub.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
